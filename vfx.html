<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>VFX - Taylor Leap</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Explore Taylor Leap's VFX portfolio showcasing visual effects work.">
    <meta name="author" content="Taylor Leap">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="VFX - Taylor Leap">
    <meta property="og:description" content="Visual effects and compositing work.">
    <meta property="og:type" content="website">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎨</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'Cubao Wide';
            src: url('assets/fonts/CubaoFree2-UltraExpanded.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Sprite Graffiti';
            src: url('assets/fonts/Sprite-Graffiti/SpriteGraffiti/Commercial/TTF/SpriteGraffiti-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --dark-bg: #242424;
            --light-bg: #FBF5F3;
            --accent-red: #D7263D;
            --text-dark: #242424;
            --text-light: #FBF5F3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-bg);
            color: var(--text-light);
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            position: relative;
        }

        /* Top Navigation */
        .top-nav {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 6rem);
            max-width: 1400px;
            height: 70px;
            background: var(--dark-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 3rem;
            z-index: 100;
            border-radius: 0 0 35px 35px;
            border-bottom: 1px solid rgba(251, 245, 243, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .nav-logo {
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-light);
            font-family: 'Cubao Wide', Impact, 'Arial Black', sans-serif;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 400;
            transition: color 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links a:hover {
            color: var(--accent-red);
        }

        .resume-btn {
            background: var(--accent-red);
            color: #fbf5f3 !important;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(215, 38, 61, 0.3);
        }

        .resume-btn:hover {
            background: #b81e2f;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(215, 38, 61, 0.4);
        }

        /* Main Content */
        .vfx-page {
            margin-top: 70px;
            min-height: 100vh;
            padding: 6rem 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .vfx-title {
            font-size: 4rem;
            text-align: center;
            color: var(--accent-red);
            margin-bottom: 4rem;
            font-weight: normal;
            letter-spacing: 6px;
            font-family: 'Cubao Wide', Impact, 'Arial Black', sans-serif;
            text-transform: uppercase;
        }

        /* VFX Grid */
        .vfx-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            margin-top: 4rem;
        }

        .vfx-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #242424 100%);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(251, 245, 243, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .vfx-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(215, 38, 61, 0.3);
            border-color: var(--accent-red);
        }

        .vfx-thumbnail {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .vfx-card:hover .vfx-thumbnail {
            transform: scale(1.05);
        }

        .vfx-info {
            padding: 1.5rem;
        }

        .vfx-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 0.5rem;
            font-family: 'Inter', sans-serif;
        }

        .vfx-type {
            font-size: 0.85rem;
            color: rgba(251, 245, 243, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Lightbox Modal for Videos */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-video-container {
            position: relative;
            width: 90%;
            max-width: 1200px;
            aspect-ratio: 16/9;
        }

        .lightbox-video {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .lightbox-close {
            position: absolute;
            top: -3rem;
            right: 0;
            font-size: 2rem;
            color: var(--text-light);
            cursor: pointer;
            background: rgba(36, 36, 36, 0.8);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(251, 245, 243, 0.2);
        }

        .lightbox-close:hover {
            background: var(--accent-red);
            transform: rotate(90deg);
        }

        /* Responsive Design */
        /* Critical Mobile Fixes */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden !important;
                max-width: 100vw !important;
            }

            .top-nav {
                width: 100% !important;
                left: 0 !important;
                right: 0 !important;
                transform: none !important;
                margin: 0 !important;
                padding: 0.5rem 1rem !important;
                justify-content: space-between !important;
                border-radius: 0 0 20px 20px;
            }

            .nav-logo {
                display: block !important;
                font-size: 1.1rem !important;
                white-space: nowrap !important;
            }

            .nav-links {
                display: none !important;
            }

            .nav-links.mobile-open {
                display: flex !important;
                position: fixed;
                top: 70px;
                left: 0;
                right: 0;
                background: var(--dark-bg);
                flex-direction: column;
                align-items: center;
                padding: 2rem;
                gap: 1.5rem;
                box-shadow: 0 8px 20px rgba(0,0,0,0.2);
                z-index: 1000;
                animation: slideDown 0.3s ease;
                max-height: calc(100vh - 70px);
                overflow-y: auto;
            }

            .mobile-menu-icon {
                display: block !important;
                font-size: 1.5rem !important;
            }

            @keyframes slideDown {
                from {
                    opacity: 0;
                    transform: translateY(-20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .vfx-page {
                padding: 4rem 1.5rem;
            }

            .vfx-title {
                font-size: 2.5rem;
            }

            .vfx-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .lightbox-video-container {
                width: 95%;
            }

            .lightbox-close {
                top: -2.5rem;
                width: 40px;
                height: 40px;
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .vfx-title {
                font-size: 2rem;
                letter-spacing: 3px;
            }

            .lightbox {
                padding: 1rem;
            }
        }

        .mobile-menu-icon {
            display: none;
            font-size: 1.8rem;
            color: var(--text-light);
            cursor: pointer;
            font-weight: 300;
            transition: all 0.3s ease;
            padding: 0.5rem;
            z-index: 1001;
        }

        .mobile-menu-icon:hover {
            color: var(--accent-red);
        }
    </style>
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <div class="nav-logo">TAYLOR LEAP</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#demo">Demo Reel</a></li>
            <li><a href="3d.html">3D</a></li>
            <li><a href="vfx.html">VFX</a></li>
            <li><a href="concept.html">Concept</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="index.html#contact">Contact</a></li>
            <li><a href="assets/documents/Resume/Taylor Leap Resume.pdf" class="resume-btn" download>Resume</a></li>
        </ul>
        <div class="mobile-menu-icon">☰</div>
    </nav>

    <!-- VFX Page Content -->
    <section class="vfx-page">
        <h1 class="vfx-title">VFX</h1>
        
        <!-- VFX Grid -->
        <div class="vfx-grid">
            <!-- Video Card Example - Replace with your actual videos -->
            <!-- You can add more cards here with different videos -->
        </div>
    </section>

    <!-- Lightbox Modal for Videos -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <div class="lightbox-video-container" onclick="event.stopPropagation()">
            <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
            <iframe id="lightbox-video" class="lightbox-video" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function openLightbox(videoSrc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxVideo = document.getElementById('lightbox-video');
            lightboxVideo.src = videoSrc;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            const lightboxVideo = document.getElementById('lightbox-video');
            lightbox.classList.remove('active');
            lightboxVideo.src = ''; // Stop video playback
            document.body.style.overflow = 'auto';
        }

        // Close lightbox on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });

        // Mobile Menu Toggle
        (function() {
            const mobileMenuIcon = document.querySelector('.mobile-menu-icon');
            const navLinks = document.querySelector('.nav-links');
            
            if (mobileMenuIcon && navLinks) {
                mobileMenuIcon.addEventListener('click', function() {
                    navLinks.classList.toggle('mobile-open');
                    mobileMenuIcon.textContent = navLinks.classList.contains('mobile-open') ? '×' : '☰';
                });

                const links = navLinks.querySelectorAll('a');
                links.forEach(link => {
                    link.addEventListener('click', function() {
                        navLinks.classList.remove('mobile-open');
                        mobileMenuIcon.textContent = '☰';
                    });
                });

                document.addEventListener('click', function(event) {
                    if (!event.target.closest('.top-nav')) {
                        navLinks.classList.remove('mobile-open');
                        mobileMenuIcon.textContent = '☰';
                    }
                });
            }
        })();
    </script>
</body>
</html>
